spring:
  application:
    name: transaction-authorizer
  datasource:
    url: jdbc:postgresql://postgres:5432/app_db
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: TransactionAuthorizerHikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      validation-timeout: 3000
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1
      auto-commit: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  autoconfigure:
    exclude:
      - io.awspring.cloud.autoconfigure.sqs.SqsAutoConfiguration

aws:
  region: sa-east-1
  sqs:
    endpoint: http://localstack:4566
    capture-queue-name: transaction-capture-queue

webhook:
  enabled: true
  url: ${WEBHOOK_URL:http://api:8080/webhook-test}
  secret: ${WEBHOOK_SECRET:super-secret-key-change-in-production}
  retry:
    max-attempts: 3
    backoff-ms: 1000
  timeout-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics"
      base-path: "/actuator"
  endpoint:
    health:
      show-details: "always"